name: v420-dev-audit
on:
  push:
    branches: [v4.20-wip]
    paths:
      - 'tools/audit_v419.py'
      - '.github/workflows/v420-dev-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Reproduce v4.19 external audit
        run: python tools/audit_v419.py --raw results/v4.19-t2-raw.jsonl --out results/v4.20-audit-v419.json --noise-sims 10000
      - name: Preserve audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v420-audit-v419
          path: results/v4.20-audit-v419.json
          if-no-files-found: error
