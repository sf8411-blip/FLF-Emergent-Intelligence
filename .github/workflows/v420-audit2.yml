name: v420-audit2
on:
  push:
    branches: [v4.20-wip]
    paths:
      - 'tools/audit_v420.py'
      - '.github/workflows/v420-audit2.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/audit_v420.py
      - uses: actions/upload-artifact@v4
        with:
          name: v420-audit-addendum2
          path: results/v4.20-audit-addendum2.json
